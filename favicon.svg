<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9955"/>
      <stop offset="50%" stop-color="#ff5f1f"/>
      <stop offset="100%" stop-color="#d43f05"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2a"/>
      <stop offset="100%" stop-color="#09090e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff5f1f" flood-opacity="0.85"/>
    </filter>
  </defs>
  
  <!-- Shield/Keycap Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#shieldGrad)" stroke="#ff5f1f" stroke-width="2.5"/>
  <rect x="8" y="8" width="48" height="48" rx="10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- High-Energy Lightning Bolt -->
  <path d="M36 10 L18 34 L32 34 L28 54 L46 28 L32 28 Z" fill="url(#boltGrad)" filter="url(#glow)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Live Signal Dot -->
  <circle cx="48" cy="16" r="3" fill="#00ffa3"/>
</svg>